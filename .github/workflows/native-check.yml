name: Test native mobile builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-check.yml
      - .github/gradle-central-mirror.gradle
      - .maestro/**
      - app.config.js
      - plugins/withAndroidBuildMemory.js
      - tests/native-ios/**
      - app.json
      - 'app/(auth)/**'
      - 'app/+native-intent.ts'
      - 'app/_layout.tsx'
      - components/ui/Input.tsx
      - components/ui/Button.tsx
      - components/ui/AuthFormScrollView.tsx
permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }} login and password recovery
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    concurrency:
      group: native-${{ matrix.platform }}-${{ github.ref }}
      cancel-in-progress: ${{ matrix.platform == 'ios' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      MAESTRO_CLI_NO_ANALYTICS: 1
      EXPO_PUBLIC_API_URL: https://lasalva.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Install verified Maestro CLI
        if: matrix.platform == 'android'
        shell: bash
        run: |
          curl -fsSL --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro"
          echo "$RUNNER_TEMP/maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Cache Android dependencies
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v4
      - name: Build an installable Android preview
        if: matrix.platform == 'android'
        env:
          LASALVA_DEVICE_PREVIEW: 1
        run: |
          npx expo prebuild --platform android --no-install
          central_status=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 'https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.9.1/gson-2.9.1.pom' || true)
          if [ "$central_status" = 429 ]; then
            mkdir -p "$HOME/.gradle/init.d"
            cp .github/gradle-central-mirror.gradle "$HOME/.gradle/init.d/"
          fi
          cd android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --max-workers=2 --no-daemon -Pkotlin.compiler.execution.strategy=in-process
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Lasalva-Preview.apk"
          "$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify "$RUNNER_TEMP/Lasalva-Preview.apk"
      - name: Save Android preview
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: Lasalva-Android-preview
          path: ${{ runner.temp }}/Lasalva-Preview.apk
          compression-level: 0
          retention-days: 14
      - name: Enable Android emulator acceleration
        if: matrix.platform == 'android'
        run: |
          sudo chown "$USER" /dev/kvm
          test -w /dev/kvm
      - name: Exercise Android forms
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install "$RUNNER_TEMP/Lasalva-Preview.apk"
            adb shell settings put secure show_ime_with_hard_keyboard 1
            maestro test -e APP_ID=com.lasalva.mobile.preview -e APP_SCHEME=lasalvapreview .maestro/auth.yaml
      - uses: ruby/setup-ruby@v1
        if: matrix.platform == 'ios'
        with:
          ruby-version: '3.3'
      - name: Build for the iOS simulator
        if: matrix.platform == 'ios'
        run: |
          npx expo prebuild --platform ios --no-install
          (cd ios && pod install)
          gem install --no-document xcodeproj -v 1.27.0
          ruby tests/native-ios/project.rb
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,items in reversed(list(devices.items())) if ".iOS-" in runtime for d in items if d["name"].startswith("iPhone")))')
          echo "IOS_TEST_DEVICE=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid"
          xcodebuild build-for-testing -workspace ios/Lasalva.xcworkspace -scheme RecoveryUITests -configuration Release -destination "id=$udid" -derivedDataPath "$RUNNER_TEMP/lasalva-ios" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/lasalva-xcode.log" || { grep -Ei 'error:|fatal error:|Multiple commands produce|failed:' "$RUNNER_TEMP/lasalva-xcode.log" | tail -40; exit 1; }
      - name: Save the iOS simulator app
        if: matrix.platform == 'ios'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/lasalva-ios/Build/Products/Release-iphonesimulator/Lasalva.app" "$RUNNER_TEMP/Lasalva-Simulator.zip"
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'ios'
        with:
          name: Lasalva-iOS-simulator
          path: ${{ runner.temp }}/Lasalva-Simulator.zip
          retention-days: 7
      - name: Exercise iOS forms
        if: matrix.platform == 'ios'
        run: |
          xcrun simctl bootstatus "$IOS_TEST_DEVICE" -b
          xcodebuild test-without-building -workspace ios/Lasalva.xcworkspace -scheme RecoveryUITests -configuration Release -destination "id=$IOS_TEST_DEVICE" -derivedDataPath "$RUNNER_TEMP/lasalva-ios" -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/RecoveryUITests.xcresult" ARCHS=arm64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/lasalva-ui.log" || { tail -100 "$RUNNER_TEMP/lasalva-ui.log"; exit 1; }
          grep -E 'Test Case|Executed [0-9]+ tests' "$RUNNER_TEMP/lasalva-ui.log" | tail -18
      - name: Save iOS test results
        if: always() && matrix.platform == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: Lasalva-iOS-test-results
          path: ${{ runner.temp }}/RecoveryUITests.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Save failed form checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-form-diagnostics
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 3
