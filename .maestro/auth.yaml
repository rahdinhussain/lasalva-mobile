appId: ${APP_ID}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 90000
- tapOn:
    id: "login-email"
- inputText: "stylist"
- tapOn:
    id: "login-password"
- inputText: "dummy"
- assertVisible:
    id: "login-password"
- tapOn: "Show password"
- assertVisible: "Hide password"
- scrollUntilVisible:
    element:
      id: "submit-login"
    direction: DOWN
- tapOn:
    id: "submit-login"
- assertVisible: "Invalid email address"
- tapOn:
    id: "forgot-password-link"
- assertVisible: "Reset password"
- tapOn:
    id: "forgot-password-email"
- inputText: "invalid"
- assertVisible:
    id: "forgot-password-email"
- scrollUntilVisible:
    element:
      id: "submit-forgot-password"
    direction: DOWN
- tapOn:
    id: "submit-forgot-password"
- assertVisible: "Invalid email address"
- openLink: "${APP_SCHEME}://reset-password?token=synthetic-local-test"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "reset-password-new-password"
    timeout: 20000
- tapOn:
    id: "reset-password-new-password"
- inputText: "short"
- tapOn:
    id: "reset-password-confirm-password"
- inputText: "short"
- assertVisible:
    id: "reset-password-confirm-password"
- scrollUntilVisible:
    element:
      id: "submit-new-password"
    direction: DOWN
- tapOn:
    id: "submit-new-password"
- assertVisible: "Password must be at least 8 characters"
