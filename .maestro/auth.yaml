appId: ${APP_ID}
---
- launchApp:
    clearState: true
# Fresh Android 15 emulators occasionally show a system launcher dialog over Lasalva.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: "android:id/alertTitle"
              text: "Quickstep isn't responding"
          commands:
            - tapOn:
                id: "android:id/aerr_close"
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 20000
- tapOn:
    id: "login-email"
- inputText: "stylist"
- tapOn:
    id: "login-password"
- inputText: "dummy"
- assertVisible:
    id: "login-password"
- tapOn: "Show password"
- assertVisible: "Hide password"
- runFlow:
    when:
      notVisible:
        id: "submit-login"
    commands:
      - swipe:
          from:
            id: "login-password"
          direction: UP
- tapOn:
    id: "submit-login"
- assertVisible: "Invalid email address"
- tapOn:
    id: "forgot-password-link"
- assertVisible: "Reset password"
- tapOn:
    id: "forgot-password-email"
- inputText: "invalid"
- assertVisible:
    id: "forgot-password-email"
- runFlow:
    when:
      notVisible:
        id: "submit-forgot-password"
    commands:
      - swipe:
          from:
            id: "forgot-password-email"
          direction: UP
- tapOn:
    id: "submit-forgot-password"
- assertVisible: "Invalid email address"
- openLink: "${APP_SCHEME}://reset-password?token=synthetic-local-test"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "reset-password-new-password"
    timeout: 20000
- tapOn:
    id: "reset-password-new-password"
- inputText: "short"
- tapOn:
    id: "reset-password-confirm-password"
- inputText: "short"
- assertVisible:
    id: "reset-password-confirm-password"
- runFlow:
    when:
      notVisible:
        id: "submit-new-password"
    commands:
      - swipe:
          from:
            id: "reset-password-confirm-password"
          direction: UP
- tapOn:
    id: "submit-new-password"
- assertVisible: "Password must be at least 8 characters"
